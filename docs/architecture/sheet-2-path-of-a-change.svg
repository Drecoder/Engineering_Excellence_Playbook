<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560" role="img" aria-labelledby="title">
  <title id="title">A thin orchestrator hands one ticket's spec to the Builder. The Builder opens a pull request and CI evaluates it: tests, scanners, the ticket's acceptance tests and the Policy Engine. A failing CI report goes back to the Builder, which fixes its own change, up to 3 attempts within a $2.00 budget, after which the ticket moves to Blocked. A pass moves the ticket to Awaiting Approval, and the owner approves the merge, the only judgment step; a QUARANTINE goes to the owner. Then the apply pipeline runs. The spec is an object in a versioned store fetched and verified by digest. Signed CI evidence goes to an independent compliance authority whose single-use token is consumed by the deployment guard. Each box is a separate identity.</title>
  <style>
  :root, svg { --sheet: #f9fafb; --ink: #1b2733; --ink-2: #3b4a59; --muted: #64758a; --rule: #c9d1da;
    --accent: #b35c00; --block: #b42318; color: #1b2733; }
  @media (prefers-color-scheme: dark) {
    :root, svg { --sheet: #151c24; --ink: #dce5ee; --ink-2: #b6c3d0; --muted: #8b9cae; --rule: #2b3642;
      --accent: #e9a24c; --block: #f2786d; color: #dce5ee; }
  }
  .bg { fill: var(--sheet); }
  .box { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.3; }
  .box.design { stroke: var(--muted); stroke-dasharray: 5 4; }
  .box.blocked { stroke: var(--block); stroke-dasharray: 5 4; }
  .box.frame { fill: none; stroke: var(--ink); stroke-width: 2; }
  .tick { fill: var(--accent); }
  .sep { stroke: var(--rule); stroke-width: 1; }
  .t { fill: var(--ink); font-family: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; font-weight: 600; font-size: 13px; }
  .design-t { fill: var(--muted); }
  .s { fill: var(--muted); font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 10.5px; }
  .xs { fill: var(--muted); font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 9px; }  /* image SVGs fall back to a wider mono */
  .band { fill: var(--ink); font-family: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif; font-weight: 700; font-size: 11.5px; letter-spacing: 0.1em; }
  .lbl { fill: var(--ink-2); font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; font-size: 11.5px; }
  .lbl.warn { fill: var(--block); }
  .lbl.key { fill: var(--accent); font-weight: 600; }
  .arrow { stroke: var(--ink); stroke-width: 1.3; fill: none; }
  .arrow.design { stroke: var(--muted); stroke-dasharray: 5 4; }
  .arrow.blocked { stroke: var(--block); stroke-dasharray: 5 4; }
  .xmark { stroke: var(--block); stroke-width: 2.2; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="560"/>
          <defs>
            <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
          </defs>

          <!-- main column -->
          <rect class="box design" x="200" y="30" width="240" height="56"/>
          <text class="t design-t" x="214" y="53">Intake · orchestrator</text><text class="s" x="214" y="71">approved spec · one ticket leased</text>
          <rect class="box" x="200" y="130" width="240" height="56"/>
          <text class="t" x="214" y="153">Builder</text><text class="s" x="214" y="171">plans only · never applies</text>
          <rect class="box" x="200" y="230" width="240" height="70"/><polygon class="tick" points="426,230 440,230 440,244"/>
          <text class="t" x="214" y="253">CI gates · sheet 3</text><text class="s" x="214" y="271">tests · scanners · acceptance tests</text><text class="s" x="214" y="288">Policy Engine (design)</text>
          <rect class="box" x="200" y="344" width="240" height="56"/>
          <text class="t" x="214" y="367">The owner approves the merge</text><text class="s" x="214" y="385">the only judgment step</text>
          <rect class="box" x="200" y="444" width="240" height="56"/>
          <text class="t" x="214" y="467">Apply pipeline</text><text class="s" x="214" y="485">own identity · post-merge</text>

          <line class="arrow design" x1="320" y1="86" x2="320" y2="129" marker-end="url(#ah2)"/>
          <text class="lbl" x="332" y="112">spec handed to the Builder</text>
          <line class="arrow" x1="320" y1="186" x2="320" y2="229" marker-end="url(#ah2)"/>
          <text class="lbl" x="332" y="212">opens PR · calls gates at SHA</text>
          <line class="arrow" x1="320" y1="300" x2="320" y2="343" marker-end="url(#ah2)"/>
          <text class="lbl" x="332" y="318">PASS: Awaiting Approval</text>
          <text class="lbl" x="332" y="333">QUARANTINE: to the owner</text>
          <line class="arrow" x1="320" y1="400" x2="320" y2="443" marker-end="url(#ah2)"/>
          <text class="lbl" x="332" y="426">merged, approved plan</text>

          <!-- fix loop: CI back to the Builder -->
          <polyline class="arrow" points="199,265 175,265 175,158 199,158" marker-end="url(#ah2)"/>
          <text class="lbl" x="166" y="190" text-anchor="end">fail: CI report back;</text>
          <text class="lbl" x="166" y="206" text-anchor="end">Builder fixes its change</text>
          <text class="lbl key" x="166" y="226" text-anchor="end">≤ 3 attempts · $2.00 stop</text>
          <text class="lbl warn" x="166" y="242" text-anchor="end">then Blocked</text>

          <!-- spec store -->
          <rect class="box design" x="520" y="30" width="220" height="56"/>
          <text class="t design-t" x="534" y="53">Object store</text><text class="s" x="534" y="71">versioned · object-locked</text>
          <line class="arrow design" x1="440" y1="58" x2="519" y2="58" marker-end="url(#ah2)"/>
          <text class="lbl" x="480" y="50" text-anchor="middle">writes spec</text>
          <polyline class="arrow design" points="630,86 630,158 441,158" marker-end="url(#ah2)"/>
          <text class="lbl" x="638" y="126">fetch, verify sha256</text>

          <!-- release authority -->
          <rect class="box design" x="520" y="344" width="220" height="56"/>
          <text class="t design-t" x="534" y="367">Compliance authority</text><text class="s" x="534" y="385">verifies evidence, signs</text>
          <polyline class="arrow design" points="440,265 630,265 630,343" marker-end="url(#ah2)"/>
          <text class="lbl" x="452" y="259">signed evidence</text>
          <rect class="box design" x="520" y="444" width="220" height="56"/>
          <text class="t design-t" x="534" y="467">Deployment guard</text><text class="s" x="534" y="485">accepts each token once</text>
          <line class="arrow design" x1="630" y1="400" x2="630" y2="443" marker-end="url(#ah2)"/>
          <text class="lbl key" x="622" y="426" text-anchor="end">RS256 token, single use</text>
          <line class="arrow design" x1="630" y1="500" x2="630" y2="544" marker-end="url(#ah2)"/>
          <text class="lbl" x="622" y="532" text-anchor="end">deploys the pinned digest</text>
        </svg>
