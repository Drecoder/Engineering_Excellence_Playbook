<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="title">
  <title id="title">Consumer repos call one reusable workflow by full commit SHA with inputs. It detects stacks, runs per-stack jobs and scanners, and routes every scanner report through a severity gate that blocks only CRITICAL or CISA KEV findings and fails closed. The gate reads OSV and KEV feeds and the caller's reviewed exceptions. A policy contract and a gate plan are designs. Genesis cannot call the workflow because it is public and the workflow's repo is private.</title>
  <style>
  :root, svg { --sheet: #f9fafb; --ink: #1b2733; --ink-2: #3b4a59; --muted: #64758a; --rule: #c9d1da;
    --accent: #b35c00; --block: #b42318; color: #1b2733; }
  @media (prefers-color-scheme: dark) {
    :root, svg { --sheet: #151c24; --ink: #dce5ee; --ink-2: #b6c3d0; --muted: #8b9cae; --rule: #2b3642;
      --accent: #e9a24c; --block: #f2786d; color: #dce5ee; }
  }
  .bg { fill: var(--sheet); }
  .box { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.3; }
  .box.design { stroke: var(--muted); stroke-dasharray: 5 4; }
  .box.blocked { stroke: var(--block); stroke-dasharray: 5 4; }
  .box.frame { fill: none; stroke: var(--ink); stroke-width: 2; }
  .tick { fill: var(--accent); }
  .sep { stroke: var(--rule); stroke-width: 1; }
  .t { fill: var(--ink); font-family: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; font-weight: 600; font-size: 13px; }
  .design-t { fill: var(--muted); }
  .s { fill: var(--muted); font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 10.5px; }
  .xs { fill: var(--muted); font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 9px; }  /* image SVGs fall back to a wider mono */
  .band { fill: var(--ink); font-family: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif; font-weight: 700; font-size: 11.5px; letter-spacing: 0.1em; }
  .lbl { fill: var(--ink-2); font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; font-size: 11.5px; }
  .lbl.warn { fill: var(--block); }
  .lbl.key { fill: var(--accent); font-weight: 600; }
  .arrow { stroke: var(--ink); stroke-width: 1.3; fill: none; }
  .arrow.design { stroke: var(--muted); stroke-dasharray: 5 4; }
  .arrow.blocked { stroke: var(--block); stroke-dasharray: 5 4; }
  .xmark { stroke: var(--block); stroke-width: 2.2; }
  </style>
  <rect class="bg" x="0" y="0" width="1000" height="500"/>
          <defs>
            <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
          </defs>

          <!-- callers -->
          <text class="lbl" x="236" y="24" text-anchor="middle">calls at a full SHA</text>
          <text class="lbl" x="236" y="36" text-anchor="middle">+ inputs</text>
          <rect class="box" x="20" y="40" width="200" height="44"/>
          <text class="t" x="34" y="60">rig</text><text class="xs" x="34" y="75">main pins b62752b</text>
          <rect class="box" x="20" y="100" width="200" height="44"/>
          <text class="t" x="34" y="120">gcp-reviewer-agent</text><text class="xs" x="34" y="135">exclude-paths: bench/corpus</text>
          <rect class="box" x="20" y="160" width="200" height="44"/>
          <text class="t" x="34" y="180">aws-builder-agent</text><text class="xs" x="34" y="195">install-bubblewrap (pending)</text>
          <rect class="box" x="20" y="220" width="200" height="44"/>
          <text class="t" x="34" y="240">sovereign-vpc-gcp</text><text class="xs" x="34" y="255">calls its own factory</text>
          <line class="arrow" x1="220" y1="62" x2="299" y2="62" marker-end="url(#ah3)"/>
          <line class="arrow" x1="220" y1="122" x2="299" y2="122" marker-end="url(#ah3)"/>
          <line class="arrow" x1="220" y1="182" x2="299" y2="182" marker-end="url(#ah3)"/>
          <line class="arrow" x1="220" y1="242" x2="299" y2="242" marker-end="url(#ah3)"/>

          <rect class="box blocked" x="20" y="300" width="200" height="44"/>
          <text class="t" x="34" y="320">Genesis</text><text class="xs" x="34" y="335">public repo</text>
          <line class="arrow blocked" x1="220" y1="322" x2="299" y2="322"/>
          <line class="xmark" x1="252" y1="314" x2="268" y2="330"/><line class="xmark" x1="268" y1="314" x2="252" y2="330"/>
          <text class="lbl warn" x="120" y="366" text-anchor="middle">public cannot call private:</text>
          <text class="lbl warn" x="120" y="381" text-anchor="middle">open decision</text>

          <!-- factory -->
          <rect class="box frame" x="300" y="20" width="440" height="460"/>
          <text class="t" x="320" y="44">gates.yml</text><text class="s" x="720" y="44" text-anchor="end">sovereign-vpc-gcp</text>

          <rect class="box" x="320" y="58" width="400" height="40"/>
          <text class="t" x="334" y="83">Detect stacks</text><text class="s" x="706" y="83" text-anchor="end">outside exclude-paths</text>
          <line class="arrow" x1="519" y1="98" x2="519" y2="129" marker-end="url(#ah3)"/>
          <text class="xs" x="320" y="122">per stack present</text>

          <rect class="box" x="320" y="130" width="92" height="44"/>
          <text class="t" x="330" y="149">HCL</text><text class="xs" x="330" y="165">fmt·lint·SEC</text>
          <rect class="box" x="422" y="130" width="92" height="44"/>
          <text class="t" x="432" y="149">TypeScript</text><text class="xs" x="432" y="165">tsc·build·test</text>
          <rect class="box" x="524" y="130" width="92" height="44"/>
          <text class="t" x="534" y="149">Python</text><text class="xs" x="534" y="165">ruff·mypy·test</text>
          <rect class="box" x="626" y="130" width="92" height="44"/>
          <text class="t" x="636" y="149">Go</text><text class="xs" x="636" y="165">vet·build·test</text>

          <text class="xs" x="320" y="202">scanners, pending #14</text>
          <rect class="box" x="320" y="210" width="92" height="44"/><polygon class="tick" points="398,210 412,210 412,224"/>
          <text class="t" x="330" y="229">Gitleaks</text><text class="xs" x="330" y="245">any secret</text>
          <rect class="box" x="422" y="210" width="92" height="44"/><polygon class="tick" points="500,210 514,210 514,224"/>
          <text class="t" x="432" y="229">Trivy</text><text class="xs" x="432" y="245">vuln·misconfig</text>
          <rect class="box" x="524" y="210" width="92" height="44"/><polygon class="tick" points="602,210 616,210 616,224"/>
          <text class="t" x="534" y="229">Semgrep</text><text class="xs" x="534" y="245">pinned rules</text>
          <rect class="box" x="626" y="210" width="92" height="44"/><polygon class="tick" points="704,210 718,210 718,224"/>
          <text class="t" x="636" y="229">Bandit</text><text class="xs" x="636" y="245">HIGH·HIGH</text>

          <line class="arrow" x1="468" y1="254" x2="468" y2="299" marker-end="url(#ah3)"/>
          <text class="lbl" x="476" y="281">every scanner report</text>

          <rect class="box" x="320" y="300" width="400" height="70"/>
          <text class="t" x="334" y="323">SEVERITY_GATE</text>
          <text class="s" x="334" y="341">trivy · npm audit · pip-audit · govulncheck</text>
          <text class="s" x="334" y="358" style="fill:var(--accent)">blocks CRITICAL or CISA KEV · fails closed</text>

          <line class="arrow" x1="519" y1="370" x2="519" y2="409" marker-end="url(#ah3)"/>
          <rect class="box" x="320" y="410" width="400" height="48"/>
          <text class="t" x="334" y="431">Pass / fail per job</text><text class="s" x="334" y="448">required checks on the pull request</text>

          <!-- inputs and outputs -->
          <rect class="box design" x="780" y="60" width="200" height="44"/>
          <text class="t design-t" x="794" y="80">ci_policy.v1</text><text class="xs" x="794" y="95">playbook contract · design</text>
          <line class="arrow design" x1="779" y1="82" x2="742" y2="82" marker-end="url(#ah3)"/>
          <text class="xs" x="760" y="76" text-anchor="middle">reads</text>

          <rect class="box design" x="780" y="140" width="200" height="44"/>
          <text class="t design-t" x="794" y="160">gate_plan.v1</text><text class="xs" x="794" y="175">evidence per change · design</text>
          <line class="arrow design" x1="741" y1="162" x2="779" y2="162" marker-end="url(#ah3)"/>
          <text class="xs" x="760" y="156" text-anchor="middle">writes</text>

          <rect class="box" x="780" y="300" width="200" height="44"/>
          <text class="t" x="794" y="320">OSV · CISA KEV</text><text class="xs" x="794" y="335">fetched per run</text>
          <line class="arrow" x1="779" y1="322" x2="722" y2="322" marker-end="url(#ah3)"/>
          <text class="xs" x="751" y="316" text-anchor="middle">feeds</text>

          <rect class="box" x="780" y="390" width="200" height="56"/><polygon class="tick" points="966,390 980,390 980,404"/>
          <text class="t" x="794" y="410">ci_exceptions.v1</text><text class="xs" x="794" y="425">caller .ci/ · CODEOWNERS</text><text class="xs" x="794" y="439">one finding · ≤ 30 days</text>
          <line class="arrow" x1="779" y1="410" x2="722" y2="360" marker-end="url(#ah3)"/>
          <text class="xs" x="762" y="374" text-anchor="middle">waives</text>
        </svg>
