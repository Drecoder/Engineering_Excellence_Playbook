<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img" aria-labelledby="title">
  <title id="title">Five layers: the playbook defines rules and contracts that every repo vendors by full commit SHA; Genesis enforces guardrails in the cloud hierarchy and vends projects; the platform repo runs network, runners, observability, inference and the CI factory; the factory's agents and tools run on the platform and build services.</title>
  <style>
  :root, svg { --sheet: #f9fafb; --ink: #1b2733; --ink-2: #3b4a59; --muted: #64758a; --rule: #c9d1da;
    --accent: #b35c00; --block: #b42318; color: #1b2733; }
  @media (prefers-color-scheme: dark) {
    :root, svg { --sheet: #151c24; --ink: #dce5ee; --ink-2: #b6c3d0; --muted: #8b9cae; --rule: #2b3642;
      --accent: #e9a24c; --block: #f2786d; color: #dce5ee; }
  }
  .bg { fill: var(--sheet); }
  .box { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.3; }
  .box.design { stroke: var(--muted); stroke-dasharray: 5 4; }
  .box.blocked { stroke: var(--block); stroke-dasharray: 5 4; }
  .box.frame { fill: none; stroke: var(--ink); stroke-width: 2; }
  .tick { fill: var(--accent); }
  .sep { stroke: var(--rule); stroke-width: 1; }
  .t { fill: var(--ink); font-family: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; font-weight: 600; font-size: 13px; }
  .design-t { fill: var(--muted); }
  .s { fill: var(--muted); font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 10.5px; }
  .xs { fill: var(--muted); font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 9px; }  /* image SVGs fall back to a wider mono */
  .band { fill: var(--ink); font-family: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif; font-weight: 700; font-size: 11.5px; letter-spacing: 0.1em; }
  .lbl { fill: var(--ink-2); font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; font-size: 11.5px; }
  .lbl.warn { fill: var(--block); }
  .lbl.key { fill: var(--accent); font-weight: 600; }
  .arrow { stroke: var(--ink); stroke-width: 1.3; fill: none; }
  .arrow.design { stroke: var(--muted); stroke-dasharray: 5 4; }
  .arrow.blocked { stroke: var(--block); stroke-dasharray: 5 4; }
  .xmark { stroke: var(--block); stroke-width: 2.2; }
  </style>
  <rect class="bg" x="0" y="0" width="1000" height="550"/>
          <defs>
            <marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
          </defs>

          <line class="sep" x1="20" y1="115" x2="990" y2="115"/>
          <line class="sep" x1="20" y1="225" x2="990" y2="225"/>
          <line class="sep" x1="20" y1="335" x2="990" y2="335"/>
          <line class="sep" x1="20" y1="445" x2="990" y2="445"/>

          <text class="band" x="20" y="58">RULES</text><text class="xs" x="20" y="74">playbook</text>
          <text class="band" x="20" y="168">GOVERNANCE</text><text class="xs" x="20" y="184">Genesis</text>
          <text class="band" x="20" y="278">PLATFORM</text><text class="xs" x="20" y="294">sovereign-vpc-gcp</text>
          <text class="band" x="20" y="388">FACTORY</text><text class="xs" x="20" y="404">agents + tools</text>
          <text class="band" x="20" y="498">SERVICES</text><text class="xs" x="20" y="514">future</text>

          <!-- vendoring bus -->
          <path class="arrow" d="M170,60 H156 V500"/>
          <line class="arrow" x1="156" y1="170" x2="169" y2="170" marker-end="url(#ah1)"/>
          <line class="arrow" x1="156" y1="280" x2="169" y2="280" marker-end="url(#ah1)"/>
          <line class="arrow" x1="156" y1="390" x2="169" y2="390" marker-end="url(#ah1)"/>
          <line class="arrow" x1="156" y1="500" x2="169" y2="500" marker-end="url(#ah1)"/>
          <text class="lbl" x="147" y="300" text-anchor="middle" transform="rotate(-90 147 300)">vendored as .playbook/ at a full commit SHA</text>

          <!-- Rules -->
          <rect class="box" x="170" y="30" width="820" height="60"/>
          <text class="t" x="186" y="56">Engineering Excellence Playbook</text>
          <text class="s" x="186" y="74">standards · AGENTS.md · schemas/ contracts · textbook · CI policy (design)</text>

          <!-- Governance -->
          <rect class="box" x="170" y="140" width="360" height="60"/><polygon class="tick" points="516,140 530,140 530,154"/>
          <text class="t" x="186" y="166">Genesis</text>
          <text class="s" x="186" y="184">GOV-* guardrails · vending · built by the agent loop</text>
          <line class="arrow" x1="530" y1="170" x2="608" y2="170" marker-end="url(#ah1)"/>
          <text class="lbl" x="569" y="162" text-anchor="middle">enforces</text>
          <rect class="box" x="610" y="140" width="380" height="60"/><polygon class="tick" points="976,140 990,140 990,154"/>
          <text class="t" x="626" y="166">Cloud hierarchy</text>
          <text class="s" x="626" y="184">GCP org policies by folder · AWS SCPs by OU</text>

          <line class="arrow" x1="350" y1="200" x2="350" y2="249" marker-end="url(#ah1)"/>
          <text class="lbl" x="358" y="242">vends projects into it</text>

          <!-- Platform -->
          <rect class="box" x="170" y="250" width="152" height="60"/>
          <text class="t" x="184" y="276">Network · state</text><text class="s" x="184" y="294">identity (WIF)</text>
          <rect class="box" x="337" y="250" width="152" height="60"/>
          <text class="t" x="351" y="276">CI runners</text><text class="s" x="351" y="294">ephemeral, per job</text>
          <rect class="box" x="504" y="250" width="152" height="60"/>
          <text class="t" x="518" y="276">Observability</text><text class="s" x="518" y="294">OTLP · alerts</text>
          <rect class="box" x="671" y="250" width="152" height="60"/><polygon class="tick" points="809,250 823,250 823,264"/>
          <text class="t" x="685" y="276">Inference</text><text class="s" x="685" y="294">Ollama · GPU bench</text>
          <rect class="box" x="838" y="250" width="152" height="60"/><polygon class="tick" points="976,250 990,250 990,264"/>
          <text class="t" x="852" y="276">CI factory</text><text class="s" x="852" y="294">gates.yml · sheet 3</text>

          <line class="arrow" x1="580" y1="359" x2="580" y2="312" marker-end="url(#ah1)"/>
          <text class="lbl" x="587" y="342">runs on</text>

          <!-- Factory -->
          <rect class="box design" x="170" y="360" width="125" height="60"/>
          <text class="t design-t" x="183" y="386">Intake</text><text class="xs" x="183" y="404">wizard · grooming</text>
          <rect class="box" x="309" y="360" width="125" height="60"/>
          <text class="t" x="322" y="386">Builder</text><text class="xs" x="322" y="404">aws-builder-agent</text>
          <rect class="box" x="448" y="360" width="125" height="60"/>
          <text class="t" x="461" y="386">Reviewer</text><text class="xs" x="461" y="404">gcp-reviewer-agent</text>
          <rect class="box" x="587" y="360" width="125" height="60"/>
          <text class="t" x="600" y="386">rig (tool)</text><text class="xs" x="600" y="404">static · trace</text>
          <rect class="box design" x="726" y="360" width="125" height="60"/>
          <text class="t design-t" x="739" y="386">Compliance</text><text class="xs" x="739" y="404">authority · guard</text>
          <rect class="box design" x="865" y="360" width="125" height="60"/>
          <text class="t design-t" x="878" y="386">Messaging</text><text class="xs" x="878" y="404">S3 · Kafka · SQS</text>

          <line class="arrow" x1="580" y1="420" x2="580" y2="469" marker-end="url(#ah1)"/>
          <text class="lbl" x="587" y="452">builds and reviews</text>

          <!-- Services -->
          <rect class="box design" x="170" y="470" width="820" height="60"/>
          <text class="t design-t" x="186" y="496">Services</text>
          <text class="s" x="186" y="514">vended by Genesis · built by the Builder · reviewed by the Reviewer · merged by a person</text>
        </svg>
