name: Markdown Lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run Markdown Lint
        # Reads .markdownlint-cli2.jsonc at the repo root (globs + rule config).
        uses: DavidAnson/markdownlint-cli2-action@v20
