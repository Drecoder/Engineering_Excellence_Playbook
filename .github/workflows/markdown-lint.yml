name: Markdown Lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Run Markdown Lint
        uses: avto-dev/markdown-lint@v1
        with:
          args: "**/*.md"