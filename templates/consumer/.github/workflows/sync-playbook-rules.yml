# Copy into a consumer repo at .github/workflows/sync-playbook-rules.yml.
# The consumer declares the playbook as a pinned dependency; the playbook never lists consumers.

name: Sync Playbook Rules

on:
  push:
    branches: [main]
    paths:
      # Runs when the pinned playbook version changes (e.g. a Dependabot bump is merged).
      - .github/workflows/sync-playbook-rules.yml
  workflow_dispatch:

permissions:
  contents: read # default; the sync job grants itself what it needs

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the chore/playbook-sync branch
      pull-requests: write # open the sync PR a person reviews
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Pinned to a full commit SHA (never a tag or branch); a bump is a reviewed PR, and merging it
      # runs this workflow, which opens the sync PR for the vendored rules at that commit.
      - uses: Drecoder/Engineering_Excellence_Playbook@917bfe3e5f2441bade630403d3068867e1bbaa8a # main, 2026-10-26
